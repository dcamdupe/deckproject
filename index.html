<title>Deck Joist Layout</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a drawing-sheet page. Key figures first, then one sheet with the top view (joists running left to right over the bearers) and the side view to its right, sharing one vertical scale so every joist lines up with its row. Only the joist, bearer, deck post, floorboard, structural post and pipe toggles are configurable. */
:root {
  --bg: #EEF1F4;
  --panel: #FFFFFF;
  --ink: #16202B;
  --muted: #586574;
  --rule: #D3D9E0;
  --field: #F7F9FB;
  --timber: #C4914F;
  --timber-edge: #7B5222;
  --timber-hi: #E3B572;
  --bearer: #8A5D32;
  --bearer-edge: #4E3216;
  --bearer-hi: #B98550;
  --post: #3E4B59;
  --post-edge: #151C24;
  --post-hi: #5F7186;
  --board: #DDBF92;
  --board-edge: #8C6A3A;
  --dpost: #6F8F4E;
  --dpost-edge: #3B5226;
  --dpost-hi: #93B56E;
  --pipe: #5C9FAE;
  --pipe-edge: #24525C;
  --pipe-hi: #86C3D0;
  --guide: #2B6CA3;
  --ok: #1E7A4C;
  --ok-bg: #E1F2E8;
  --warn: #8F5405;
  --warn-bg: #FBEBCF;
  --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161B;
    --panel: #1A2128;
    --ink: #E7ECF1;
    --muted: #9BA8B5;
    --rule: #2C3640;
    --field: #222B33;
    --timber: #B8844A;
    --timber-edge: #E6BE8B;
    --timber-hi: #E3A862;
    --bearer: #7A5835;
    --bearer-edge: #D9B284;
    --bearer-hi: #A97A4A;
    --post: #8493A3;
    --post-edge: #D8E0E8;
    --post-hi: #A9B7C6;
    --board: #CDAA76;
    --board-edge: #F0D9B0;
    --dpost: #7FA05A;
    --dpost-edge: #CFE3B5;
    --dpost-hi: #A5C77E;
    --pipe: #5FB0BE;
    --pipe-edge: #CBEFF5;
    --pipe-hi: #8AD3DF;
    --guide: #7DB3E0;
    --ok: #6CCB97;
    --ok-bg: #16301F;
    --warn: #F0B866;
    --warn-bg: #352612;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161B;
  --panel: #1A2128;
  --ink: #E7ECF1;
  --muted: #9BA8B5;
  --rule: #2C3640;
  --field: #222B33;
  --timber: #B8844A;
  --timber-edge: #E6BE8B;
  --timber-hi: #E3A862;
  --bearer: #7A5835;
  --bearer-edge: #D9B284;
  --bearer-hi: #A97A4A;
  --post: #8493A3;
  --post-edge: #D8E0E8;
  --post-hi: #A9B7C6;
  --board: #CDAA76;
  --board-edge: #F0D9B0;
  --dpost: #7FA05A;
  --dpost-edge: #CFE3B5;
  --dpost-hi: #A5C77E;
  --pipe: #5FB0BE;
  --pipe-edge: #CBEFF5;
  --pipe-hi: #8AD3DF;
  --guide: #7DB3E0;
  --ok: #6CCB97;
  --ok-bg: #16301F;
  --warn: #F0B866;
  --warn-bg: #352612;
  color-scheme: dark;
}
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.55 var(--sans);
  padding-inline: 16px;
  padding-block: 24px 48px;
}
.wrap { max-width: 1120px; margin-inline: auto; display: flex; flex-direction: column; gap: 20px; }
.eyebrow { margin: 0; font: 500 12px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 8px 0 6px; font-size: 30px; line-height: 1.15; font-weight: 600; text-wrap: balance; }
h2 { margin: 0; font-size: 16px; font-weight: 600; }
.lede { margin: 0; color: var(--muted); max-width: 65ch; }
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px 24px; }
.chip { border-top: 2px solid var(--ink); padding-top: 8px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.chip .k { font: 500 11px/1.3 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.chip .v { font: 500 26px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
.chip .v small { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 4px; }
.chip .s { font-size: 13px; color: var(--muted); }
.pill { display: inline-block; align-self: flex-start; margin-top: 4px; font: 500 12px/1 var(--sans); padding: 4px 8px; border-radius: 3px; }
.pill.ok { color: var(--ok); background: var(--ok-bg); }
.pill.warn { color: var(--warn); background: var(--warn-bg); }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; }
.toggle { position: relative; display: inline-flex; align-items: center; cursor: pointer; font-size: 14px; }
.toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.toggle span::before { content: ""; display: inline-block; width: 14px; height: 14px; margin-right: 8px; vertical-align: -2px; border: 1.5px solid var(--muted); border-radius: 3px; background: var(--field); box-sizing: border-box; }
.toggle input:checked + span::before { background: var(--guide); border-color: var(--guide); box-shadow: inset 0 0 0 2px var(--panel); }
.toggle input:focus-visible + span { outline: 2px solid var(--guide); outline-offset: 3px; }
.sw { display: inline-block; width: 12px; height: 12px; margin-left: 8px; border-radius: 2px; vertical-align: -1px; }
.sw.j { background: var(--timber); border: 1px solid var(--timber-edge); }
.sw.b { background: var(--bearer); border: 1px solid var(--bearer-edge); }
.sw.p { background: var(--post); border: 1px solid var(--post-edge); }
.sw.d { background: var(--dpost); border: 1px solid var(--dpost-edge); }
.sw.f { background: var(--board); border: 1px solid var(--board-edge); }
.sw.v { background: var(--pipe); border: 1px solid var(--pipe-edge); }
figure { margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.scroller { overflow-x: auto; }
svg { display: block; width: 100%; min-width: 900px; max-width: 1040px; height: auto; margin-inline: auto; color: var(--ink); }
svg text { font-family: var(--mono); font-size: 11px; fill: var(--muted); }
svg .num { fill: var(--ink); font-weight: 500; }
svg .dim line { stroke: var(--guide); stroke-width: 1; }
svg .dim text { fill: var(--guide); }
svg .ext { stroke: var(--guide); stroke-width: 0.75; stroke-dasharray: 2 3; opacity: 0.7; }
svg .outline { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 5 4; }
svg .joist rect { fill: var(--timber); stroke: var(--timber-edge); stroke-width: 1; transition: fill 0.12s; }
svg .bearer rect { fill: var(--bearer); stroke: var(--bearer-edge); stroke-width: 1; transition: fill 0.12s; }
/* stringers share the joist look; the ledger shares the bearer look; the footing is concrete */
svg .stringer rect, svg .stringer polygon { fill: var(--timber); stroke: var(--timber-edge); stroke-width: 1; transition: fill 0.12s; }
svg .stringer { cursor: pointer; }
svg .stringer.on rect, svg .stringer.on polygon, svg .stringer:hover rect, svg .stringer:hover polygon { fill: var(--timber-hi); stroke-width: 1.75; }
.stringer:focus-visible { outline: 2px solid var(--guide); outline-offset: 2px; }
svg .ledger { fill: var(--bearer); stroke: var(--bearer-edge); stroke-width: 1; }
svg .pad { fill: var(--rule); stroke: var(--muted); stroke-width: 1; }
svg .post rect { fill: var(--post); stroke: var(--post-edge); stroke-width: 1; transition: fill 0.12s; }
svg .post rect.open { stroke: none; }
svg .post line.edge { stroke: var(--post-edge); stroke-width: 1; }
svg .post line.brk { stroke: var(--post-edge); stroke-width: 1; stroke-dasharray: 3 2; }
/* layers are opaque and stacked in build order: pipe, posts, bearers, joists, boards */
svg .board rect { fill: var(--board); stroke: var(--board-edge); stroke-width: 0.75; }
/* labels that sit over the deck get a panel-coloured halo so they stay readable on the boards */
svg .halo text { paint-order: stroke; stroke: var(--panel); stroke-width: 3px; stroke-linejoin: round; }
svg .dpost rect { fill: var(--dpost); stroke: var(--dpost-edge); stroke-width: 1; transition: fill 0.12s; }
svg .dpost rect.open { stroke: none; }
svg .dpost line.edge { stroke: var(--dpost-edge); stroke-width: 1; }
svg .dpost line.brk { stroke: var(--dpost-edge); stroke-width: 1; stroke-dasharray: 3 2; }
svg .dpost.on rect, svg .dpost:hover rect { fill: var(--dpost-hi); }
svg .joist, svg .bearer, svg .post, svg .dpost { cursor: pointer; }
svg .joist.on rect, svg .joist:hover rect { fill: var(--timber-hi); stroke-width: 1.75; }
svg .bearer.on rect, svg .bearer:hover rect { fill: var(--bearer-hi); stroke-width: 1.75; }
svg .post.on rect, svg .post:hover rect { fill: var(--post-hi); }
.joist:focus-visible, .bearer:focus-visible, .post:focus-visible, .dpost:focus-visible { outline: 2px solid var(--guide); outline-offset: 2px; }
/* the pipe is the bottom layer, under the posts, frame and boards */
svg .pipe { cursor: pointer; }
svg .pipe path { fill: none; stroke-linejoin: miter; }
svg .pipe .pe { stroke: var(--pipe-edge); }
svg .pipe .pf { stroke: var(--pipe); transition: stroke 0.12s; }
svg .pipe .pc { stroke: var(--pipe-edge); stroke-width: 0.75; stroke-dasharray: 6 3 1 3; }
svg .pipe.on .pf, svg .pipe:hover .pf { stroke: var(--pipe-hi); }
.pipe:focus-visible { outline: 2px solid var(--guide); outline-offset: 2px; }
.readout { margin: 0; min-height: 3.1em; font: 14px/1.55 var(--mono); color: var(--ink); }
@media (prefers-reduced-motion: reduce) { svg .joist rect, svg .bearer rect, svg .post rect, svg .dpost rect { transition: none; } }
</style>

<main class="wrap">
  <header>
    <p class="eyebrow">Deck build · Sections and steps</p>
    <h1>Joist layout</h1>
    <p class="lede" id="lede"></p>
  </header>

  <section class="chips" id="chips" aria-label="Layout summary"></section>

  <section class="panel" aria-labelledby="sheet-h">
    <div class="bar">
      <h2 id="sheet-h">Top view and side view</h2>
      <label class="toggle"><input type="checkbox" id="t-j" checked><span>Joists<i class="sw j"></i></span></label>
      <label class="toggle"><input type="checkbox" id="t-b" checked><span>Bearers<i class="sw b"></i></span></label>
      <label class="toggle"><input type="checkbox" id="t-d" checked><span>Deck posts<i class="sw d"></i></span></label>
      <label class="toggle"><input type="checkbox" id="t-f" checked><span>Floorboards<i class="sw f"></i></span></label>
      <label class="toggle"><input type="checkbox" id="t-p" checked><span>Structural post<i class="sw p"></i></span></label>
      <label class="toggle"><input type="checkbox" id="t-v" checked><span>PVC pipe<i class="sw v"></i></span></label>
    </div>
    <figure>
      <div class="scroller"><svg id="sheet" role="img"></svg></div>
    </figure>
    <p class="readout" id="readout" aria-live="polite"></p>
  </section>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var P = { W: 1874, L: 2750, t: 45, d: 90, maxC: 450, nb: 3, bt: 45, bd: 140, ps: 90, pt: 2000, pr: 258, pg: 20, dbl: [0], dps: 90, npp: 3, pf: 0, pe: 50, bw: 135, bh: 20, bg: 2 };
  /* DROP is the measured fall to the grass, split into equal falls: one between the sections, then one per step and one to the ground */
  var DROP = 882, GOING = 245, NSTEPS = 3, FALL = DROP / (NSTEPS + 2);
  function sub(o) { var r = {}, k; for (k in P) r[k] = P[k]; for (k in o) r[k] = o[k]; return r; }
  /* section 2 and the steps have no structural post and a double joist at their bottom edge */
  var P2 = sub({ L: 1075, pt: null, dbl: [3], npp: 2, pf: 50, pe: 0 });
  var PS = sub({ L: GOING, pt: null, dbl: [], pf: 0, pe: 0 });
  /* stringers carry the steps: ns across the width, cut from sd x t stock (the owner's 290 x 65 H3), fixed to a ledger (ld deep) and landing on a footing.
     maxC is the owner's accepted limit, a little over the 450 mm joist limit */
  var ST = { ns: 5, sd: 290, t: 65, ld: 190, pad: 80, maxC: 460 };
  var K = 0.27, OX = 176, OY = 74, SX = 748, VBW = 1040, GUIDE_SPAN = 1000;
  var sel = null;

  function fmt(v) {
    var r = Math.round(v * 10) / 10;
    return r.toLocaleString('en-AU', { minimumFractionDigits: Number.isInteger(r) ? 0 : 1, maximumFractionDigits: 1 });
  }
  function r1(v) { return Math.round(v * 100) / 100; }
  function gap(a0, a1, b0, b1) { return Math.max(a0 - b1, b0 - a1, 0); }

  /* boards laid side by side over a distance; the last one is cut down to fit */
  function strips(total, p) {
    var a = [], x = 0;
    while (x < total - 1e-9) { a.push({ x: x, w: Math.min(p.bw, total - x) }); x += p.bw + p.bg; }
    return a;
  }

  /* face boards fill the step face below the board above, down to the next level */
  function faceBoards(sc) { return strips(sc.rise - sc.p.bh, sc.p); }
  /* wording for a cut last board and for the face boards of a step */
  function cutNote(a) { var l = a[a.length - 1]; return l.w < P.bw - 1e-9 ? ', the ' + (a.length > 1 ? 'back' : 'only') + ' one cut to ' + fmt(l.w) + ' mm' : ''; }
  function faceNote(sc) { var a = faceBoards(sc); return a.length + (a.length === 1 ? ' board' : ' boards') + ' (' + a.map(function (b) { return fmt(b.w); }).join(' and ') + ' mm)'; }
  /* length of a section's lengthwise boards */
  function boardLen(si) { var p = S[si].p; return p.L - (si > 0 ? p.bh : 0) + p.bh - p.bw - p.bg; }

  function calc(p) {
    var n = Math.max(1, Math.ceil((p.L - p.t) / p.maxC - 1e-9));
    var c = (p.L - p.t) / n;
    var xs = [], ys = [], i, j;
    for (i = 0; i <= n; i++) xs.push(p.t / 2 + i * c);
    var s = (p.W - p.bt) / (p.nb - 1);
    for (j = 0; j < p.nb; j++) ys.push(p.bt / 2 + j * s);
    /* doubled joists get a second member on the inward side */
    var ds = xs.map(function (x, k) { return p.dbl.indexOf(k) < 0 ? 0 : (k === n ? -p.t : p.t); });
    var hasPost = p.pt !== null, k = 0;
    if (hasPost) {
      /* last joist above the post moves to pg clear of it; those before it share the space evenly */
      for (i = 0; i <= n; i++) if (xs[i] + p.t / 2 <= p.pt - p.pg) k = i;
      xs[k] = p.pt - p.pg - p.t / 2;
      var a = p.t + Math.max(ds[0], 0), g = (xs[k] - p.t / 2 - a - (k - 1) * p.t) / k;
      for (i = 1; i < k; i++) xs[i] = a + i * g + (i - 1) * p.t + p.t / 2;
    }
    /* full-length member centres, used for spacing checks and dimensions */
    var fs = [];
    for (i = 0; i <= n; i++) { fs.push(xs[i]); if (ds[i]) fs.push(xs[i] + ds[i]); }
    fs.sort(function (u, v) { return u - v; });
    var mc = 0;
    for (i = 1; i < fs.length; i++) mc = Math.max(mc, fs[i] - fs[i - 1]);
    var postX = p.W - p.pr - p.ps;
    /* deck posts under each bearer, kept inside the deck outline; the first and last rows are set back pf and pe from the ends */
    var dp = [], q;
    for (j = 0; j < p.nb; j++) for (q = 0; q < p.npp; q++) {
      dp.push({ j: j, r: q, x: Math.min(Math.max(ys[j], p.dps / 2), p.W - p.dps / 2), y: p.npp > 1 ? p.dps / 2 + q * (p.L - p.dps) / (p.npp - 1) + (q === 0 ? p.pf : 0) - (q === p.npp - 1 ? p.pe : 0) : p.L / 2 });
    }
    /* post centre-to-centre distances along a bearer */
    var bs = [];
    for (q = 1; q < p.npp; q++) bs.push(dp[q].y - dp[q - 1].y);
    /* floorboards across the width; the last one is cut down to fit */
    var fb = strips(p.W, p);
    var ex = null, nearJ = Infinity, nearB = Infinity, between = '';
    if (hasPost) {
      /* short joist below the post, from the central bearer to the right edge */
      ex = { y: p.pt + p.ps + p.pg + p.t / 2, x0: ys[(p.nb - 1) >> 1] - p.bt / 2, x1: p.W, name: (k + 1) + 'a' };
      nearJ = gap(ex.y - p.t / 2, ex.y + p.t / 2, p.pt, p.pt + p.ps);
      between = 'joists ' + (k + 1) + ' and ' + ex.name;
      for (i = 0; i <= n; i++) nearJ = Math.min(nearJ, gap(xs[i] - p.t / 2 + Math.min(ds[i], 0), xs[i] + p.t / 2 + Math.max(ds[i], 0), p.pt, p.pt + p.ps));
      for (j = 0; j < p.nb; j++) nearB = Math.min(nearB, gap(ys[j] - p.bt / 2, ys[j] + p.bt / 2, postX, postX + p.ps));
    }
    return { n: n, c: c, xs: xs, ds: ds, fs: fs, mc: mc, ex: ex, dp: dp, fb: fb, bs: bs, s: s, ys: ys, postX: postX, nearJ: nearJ, nearB: nearB, between: between };
  }
  var m = calc(P), m2 = calc(P2);
  /* off: distance down the top view; drop: how far it sits below section 1; rise: height of its step face */
  var S = [{ name: 'Section 1', p: P, m: m }, { name: 'Section 2', p: P2, m: m2 }];
  for (var i0 = 0; i0 < NSTEPS; i0++) S.push({ name: 'Step ' + (i0 + 1), p: PS, m: calc(PS), step: true });
  var TOTAL = 0;
  S.forEach(function (sc, si) { sc.off = TOTAL; sc.drop = si * FALL; sc.rise = FALL; TOTAL += sc.p.L; });
  var GROUND = DROP;
  /* stringer geometry, measured as run from the end of section 2 and depth below the board top of section 1 */
  var SG = (function () {
    var z0 = S[1].drop, hyp = Math.sqrt(FALL * FALL + GOING * GOING), slope = FALL / GOING;
    var throat = ST.sd - FALL * GOING / hyp, top = z0 + FALL + P.bh, off = throat * hyp / GOING;
    var under = function (r) { return top + off + slope * r; };
    var run = NSTEPS * GOING, foot = (GROUND - top - off) / slope, pts = [[P.t, top]], k;
    for (k = 1; k <= NSTEPS; k++) { pts.push([k * GOING, z0 + k * FALL + P.bh]); pts.push([k * GOING, k < NSTEPS ? z0 + (k + 1) * FALL + P.bh : GROUND]); }
    pts.push([foot, GROUND]); pts.push([P.t, under(P.t)]);
    var c = (P.W - ST.t) / (ST.ns - 1), xs = [];
    for (k = 0; k < ST.ns; k++) xs.push(ST.t / 2 + k * c);
    return { pts: pts, top: top, throat: throat, run: run, foot: foot, c: c, xs: xs };
  })();

  /* PVC pipe under the deck, measured from the right edge: down turn mm, across to r1, then down the rest of the deck */
  var PV = { d: 90, r0: 115, turn: 600, r1: 1020 };
  var PVG = (function () {
    var xa = P.W - PV.r0, xb = P.W - PV.r1, h = PV.d / 2;
    var pts = [[xa, 0], [xa, PV.turn], [xb, PV.turn], [xb, TOTAL]];
    var segs = [[xa - h, xa + h, 0, PV.turn + h], [xb - h, xa + h, PV.turn - h, PV.turn + h], [xb - h, xb + h, PV.turn - h, TOTAL]];
    /* plan clearance from the pipe to a box, 0 where they overlap */
    var clear = function (b) { return Math.min.apply(null, segs.map(function (g) { return Math.hypot(gap(g[0], g[1], b[0], b[1]), gap(g[2], g[3], b[2], b[3])); })); };
    var nearD = { g: Infinity }, nearT = Infinity, k;
    S.forEach(function (sc, si) {
      if (sc.step) return;
      sc.m.dp.forEach(function (d, q) {
        var r = sc.p.dps / 2, g = clear([d.x - r, d.x + r, sc.off + d.y - r, sc.off + d.y + r]);
        if (g < nearD.g) nearD = { g: g, s: si, q: q };
      });
    });
    for (k = 0; k < ST.ns; k++) nearT = Math.min(nearT, clear([SG.xs[k] - ST.t / 2, SG.xs[k] + ST.t / 2, S[2].off + P.t, S[2].off + SG.run]));
    var nearP = clear([m.postX, m.postX + P.ps, P.pt, P.pt + P.ps]);
    return { pts: pts, len: PV.turn + (xa - xb) + (TOTAL - PV.turn), nearD: nearD, nearT: nearT, nearP: nearP };
  })();

  function dimH(x1, x2, y, label, below) {
    return '<g class="dim"><line x1="' + x1 + '" y1="' + y + '" x2="' + x2 + '" y2="' + y + '"/>' +
      '<line x1="' + x1 + '" y1="' + (y - 4) + '" x2="' + x1 + '" y2="' + (y + 4) + '"/>' +

  function secName(si) { return S[si].name + ': '; }

  function isOn(k, si, i) { return sel && sel.k === k && sel.s === si && (i === undefined || sel.i === i) ? ' on' : ''; }

  function drawSheet() {

    if (showP) o += '<g class="post' + postOn + '" data-side="1" tabindex="0" role="img" aria-label="Structural post seen from the side, continuing above and below the frame"><title>Structural post seen from the side. Its height is not set yet.</title>' +
      '<rect class="open" x="' + sideL + '" y="' + r1(ppy) + '" width="' + r1(sideR - sideL) + '" height="' + r1(psz) + '"/>' +
      '<line class="edge" x1="' + sideL + '" y1="' + r1(ppy) + '" x2="' + r1(sideR) + '" y2="' + r1(ppy) + '"/>' +
      '<line class="edge" x1="' + sideL + '" y1="' + r1(ppy + psz) + '" x2="' + r1(sideR) + '" y2="' + r1(ppy + psz) + '"/>' +
      '<line class="brk" x1="' + sideL + '" y1="' + r1(ppy - 3) + '" x2="' + sideL + '" y2="' + r1(ppy + psz + 3) + '"/>' +

    if (showV) {

      o += '<g class="pipe' + (sel && sel.k === 'v' ? ' on' : '') + '" tabindex="0" role="img" aria-label="' + pipeLabel() + '"><title>' + pipeLabel() + '</title>' +
        '<path class="pe" d="' + pd + '" stroke-width="' + r1(PV.d * K + 2) + '"/><path class="pf" d="' + pd + '" stroke-width="' + r1(PV.d * K) + '"/><path class="pc" d="' + pd + '"/></g>';
      late += '<g class="halo">' + dimH(r1(pvx0), r1(OX + w), r1(OY + 60), fmt(PV.r0)) + dimH(r1(pvx1), r1(OX + w), r1(pvy + 140), fmt(PV.r1)) +
        dimV(r1(pvx0 - 30), OY, r1(pvy), fmt(PV.turn)) + '<text x="' + r1(pvx1 - 16) + '" y="' + r1(pvy + 60) + '" text-anchor="end">PVC pipe</text></g>';
    }

    /* each section: oy is its top in the sheet, sx is its side view shifted right by its drop */
    S.forEach(function (sc, si) {

    if (showB) {

      '<rect x="' + r1(ppx) + '" y="' + r1(ppy) + '" width="' + r1(psz) + '" height="' + r1(psz) + '"/></g>';
    if (showP) o += '<g class="halo"><text x="' + r1(ppx - 6) + '" y="' + r1(ppy + psz / 2) + '" text-anchor="end" dominant-baseline="central">Post</text></g>';
    if (showP) o += '<line class="ext" x1="' + (OX - 130) + '" y1="' + r1(ppy) + '" x2="' + r1(ppx) + '" y2="' + r1(ppy) + '"/>';
    if (showP) o += dimV(OX - 126, OY, r1(ppy), fmt(P.pt));
    if (showP) o += '<g class="halo">' + dimH(r1(ppx + psz), r1(OX + w), r1(ppy + psz / 2), fmt(P.pr)) + '</g>';

    var svg = $('sheet');
    svg.setAttribute('viewBox', '0 0 ' + VBW + ' ' + vbH);
    svg.setAttribute('aria-label', 'Top view with the side view to its right. Section 1: ' + (m.n + 1) + ' joists and one short joist running left to right over ' + P.nb + ' bearers that run the ' + fmt(P.L) + ' mm length, with a ' + fmt(P.ps) + ' mm square structural post in the gap between ' + m.between + '. Section 2, below it and ' + fmt(FALL) + ' mm lower: ' + (m2.n + 1) + ' joists over ' + P2.nb + ' bearers that run its ' + fmt(P2.L) + ' mm length. Below that, ' + NSTEPS + ' steps, each ' + fmt(GOING) + ' mm deep and ' + fmt(FALL) + ' mm lower than the last, down to the ground ' + fmt(GROUND) + ' mm below section 1.');
    svg.innerHTML = o;
  }

  function drawText() {
    var mc = Math.max(m.mc, m2.mc);
    var centresOk = mc <= P.maxC + 1e-9;
    var spanOk = m.s <= GUIDE_SPAN;
    var postOk = m.nearJ > 0 && m.nearB > 0;
    var cut = m.fb[m.fb.length - 1].w;
    $('chips').innerHTML =
      '<div class="chip"><span class="k">Joists</span><span class="v">' + (m.n + 1) + ' + ' + (m2.n + 1) + '</span><span class="s">' + fmt(P.t) + ' x ' + fmt(P.d) + ' mm, each ' + fmt(P.W) + ' mm long. ' + S.map(function (sc) { return sc.p.dbl.length && !sc.step ? sc.name + ' has joist ' + sc.p.dbl.map(function (k) { return k + 1; }).join(', ') + ' doubled. ' : ''; }).join('') + 'Section 1 also has short joist ' + m.ex.name + ' at ' + fmt(m.ex.x1 - m.ex.x0) + ' mm</span></div>' +
      '<div class="chip"><span class="k">Max joist centres</span><span class="v">' + fmt(mc) + '<small>mm</small></span><span class="s">section 1 up to ' + fmt(m.mc) + ' mm, section 2 ' + fmt(m2.mc) + ' mm</span>' +
        '<span class="pill ' + (centresOk ? 'ok' : 'warn') + '">' + (centresOk ? 'Within ' + fmt(P.maxC) + ' mm max' : 'Over ' + fmt(P.maxC) + ' mm max') + '</span></div>' +
      '<div class="chip"><span class="k">Bearers</span><span class="v">' + P.nb + ' + ' + P2.nb + '</span><span class="s">' + fmt(P.bd) + ' x ' + fmt(P.bt) + ' mm (assumed), ' + fmt(P.L) + ' and ' + fmt(P2.L) + ' mm long</span></div>' +
      '<div class="chip"><span class="k">Joist span</span><span class="v">' + fmt(m.s) + '<small>mm</small></span><span class="s">between bearer centres, both sections</span>' +
        '<span class="pill ' + (spanOk ? 'ok' : 'warn') + '">' + (spanOk ? 'Within the ~1,000 mm guide' : 'Over the ~1,000 mm guide') + '</span></div>' +
      '<div class="chip"><span class="k">Structural post</span><span class="v">' + fmt(P.ps) + ' x ' + fmt(P.ps) + '<small>mm</small></span><span class="s">nearest joist ' + fmt(m.nearJ) + ' mm, nearest bearer ' + fmt(m.nearB) + ' mm</span>' +
        '<span class="pill ' + (postOk ? 'ok' : 'warn') + '">' + (postOk ? 'Clear of all joists and bearers' : 'Touches a joist or bearer') + '</span></div>' +
      '<div class="chip"><span class="k">Deck posts</span><span class="v">' + m.dp.length + ' + ' + m2.dp.length + '</span><span class="s">' + fmt(P.dps) + ' x ' + fmt(P.dps) + ' mm (assumed), ' + P.npp + ' and ' + P2.npp + ' per bearer, ' + m.bs.map(fmt).join(' and ') + ' mm centres in section 1, ' + m2.bs.map(fmt).join(' and ') + ' mm in section 2. Section 1\'s end posts and section 2\'s top posts are set back ' + fmt(P.pe) + ' and ' + fmt(P2.pf) + ' mm</span></div>' +
      '<div class="chip"><span class="k">PVC pipe</span><span class="v">' + fmt(PV.d) + '<small>mm</small></span><span class="s">' + fmt(PV.r0) + ' mm from the right edge, turning at ' + fmt(PV.turn) + ' mm to run ' + fmt(PV.r1) + ' mm from the right edge. Nearest deck post ' + fmt(PVG.nearD.g) + ' mm, nearest stringer ' + fmt(PVG.nearT) + ' mm, in plan</span>' +
        '<span class="pill ' + (PVG.nearD.g > 0 && PVG.nearT > 0 ? 'ok' : 'warn') + '">' + (PVG.nearD.g > 0 && PVG.nearT > 0 ? 'Clear of all posts and stringers' : 'Passes under a deck post or stringer') + '</span></div>' +
      '<div class="chip"><span class="k">Floorboards</span><span class="v">' + m.fb.length + ' + ' + m2.fb.length + '</span><span class="s">' + fmt(P.bw) + ' x ' + fmt(P.bh) + ' mm, ' + fmt(P.bg) + ' mm gaps, ' + fmt(boardLen(0)) + ' and ' + fmt(boardLen(1)) + ' mm long' + (cut < P.bw ? ', last board cut to ' + fmt(cut) + ' mm' : '') + '</span></div>' +
      '<div class="chip"><span class="k">Steps</span><span class="v">' + NSTEPS + '</span><span class="s">' + fmt(GOING) + ' mm going, ' + strips(GOING, P).length + ' boards laid across each' + cutNote(strips(GOING, P)) + '</span></div>' +
      '<div class="chip"><span class="k">Stringers</span><span class="v">' + ST.ns + '</span><span class="s">' + fmt(ST.sd) + ' x ' + fmt(ST.t) + ' mm H3 at ' + fmt(SG.c) + ' mm centres, about ' + fmt(Math.round(SG.throat)) + ' mm left under each notch. Fixed to a ledger on the end posts of section 2, landing on a concrete footing</span>' +
        '<span class="pill ' + (SG.c <= ST.maxC ? 'ok' : 'warn') + '">' + (SG.c <= P.maxC ? 'Within ' + fmt(P.maxC) + ' mm max' : SG.c <= ST.maxC ? fmt(Math.round(SG.c - P.maxC)) + ' mm over ' + fmt(P.maxC) + ' mm, accepted' : 'Over ' + fmt(ST.maxC) + ' mm max') + '</span></div>' +
      '<div class="chip"><span class="k">Step face boards</span><span class="v">' + S.length * faceBoards(S[0]).length + '</span><span class="s">' + faceBoards(S[0]).map(function (b) { return fmt(b.w); }).join(' and ') + ' mm ' + (faceBoards(S[0]).length === 1 ? 'board' : 'boards') + ' on each of the ' + S.length + ' step faces, tucked under the board above, which overhangs by ' + fmt(P.bh) + ' mm. Sections 1 and 2 each end in one edge board laid across</span></div>' +
      '<div class="chip"><span class="k">Total drop</span><span class="v">' + fmt(GROUND) + '<small>mm</small></span><span class="s">' + S.length + ' falls of ' + fmt(FALL) + ' mm from section 1 to the ground</span></div>';
    $('lede').textContent = 'Two sections and ' + NSTEPS + ' steps, ' + fmt(P.W) + ' mm wide. Section 1 is ' + fmt(P.L) + ' mm long with ' + (m.n + 1) + ' joists at up to ' + fmt(m.mc) + ' mm centres; its ' + fmt(P.ps) + ' x ' + fmt(P.ps) + ' mm structural post stands between ' + m.between + ', each ' + fmt(P.pg) + ' mm clear of it. Section 2 steps down ' + fmt(FALL) + ' mm and is ' + fmt(P2.L) + ' mm long with ' + (m2.n + 1) + ' joists at ' + fmt(m2.mc) + ' mm centres. Each section sits on ' + P.nb + ' bearers. ' + NSTEPS + ' steps on ' + ST.ns + ' stringers then run down to the ground, each with a ' + fmt(GOING) + ' mm going and a ' + fmt(FALL) + ' mm fall, for a total drop of ' + fmt(GROUND) + ' mm.';
  }

  function attr(g, name) { return parseInt(g.getAttribute(name), 10); }
  function paintSel() {
    Array.prototype.forEach.call(document.querySelectorAll('#sheet .joist[data-i]'), function (g) {
      g.classList.toggle('on', !!sel && sel.k === 'j' && attr(g, 'data-s') === sel.s && attr(g, 'data-i') === sel.i);
    });
    Array.prototype.forEach.call(document.querySelectorAll('#sheet .bearer'), function (g) {
      var side = g.hasAttribute('data-side');
      g.classList.toggle('on', !!sel && sel.k === 'b' && attr(g, 'data-s') === sel.s && (side || attr(g, 'data-j') === sel.i));
    });
    Array.prototype.forEach.call(document.querySelectorAll('#sheet .post'), function (g) {
      g.classList.toggle('on', !!sel && sel.k === 'p');
    });
    Array.prototype.forEach.call(document.querySelectorAll('#sheet .dpost'), function (g) {
      var hit = g.hasAttribute('data-r') ? sel && sel.i % S[sel.s].p.npp === attr(g, 'data-r') : sel && sel.i === attr(g, 'data-q');
      g.classList.toggle('on', !!sel && sel.k === 'd' && attr(g, 'data-s') === sel.s && !!hit);
    });
    Array.prototype.forEach.call(document.querySelectorAll('#sheet .pipe'), function (g) {
      g.classList.toggle('on', !!sel && sel.k === 'v');
    });
    Array.prototype.forEach.call(document.querySelectorAll('#sheet .stringer'), function (g) {
      g.classList.toggle('on', !!sel && sel.k === 't' && attr(g, 'data-t') === sel.i);
    });
    var text = 'Hover, tap or tab to a joist, bearer, stringer, post or the pipe to read its position.';
    if (sel) text = (sel.k === 'v' ? pipeLabel() : sel.k === 't' ? stringerLabel(sel.i) : sel.k === 'j' ? joistLabel(sel.s, sel.i) : (sel.k === 'b' ? bearerLabel(sel.s, sel.i) : (sel.k === 'd' ? dpostLabel(sel.s, sel.i) : postLabel()))) + '.';
    $('readout').textContent = text;
  }

  function bind(g, make) {
    var on = function () { sel = make(); paintSel(); };
    g.addEventListener('mouseenter', on);
    g.addEventListener('focus', on);
    g.addEventListener('click', on);
  }

  function wire() {
    Array.prototype.forEach.call(document.querySelectorAll('#sheet .pipe'), function (g) {
      bind(g, function () { return { k: 'v', i: 0, s: 0 }; });
    });
    Array.prototype.forEach.call(document.querySelectorAll('#sheet .stringer'), function (g) {
      var i = attr(g, 'data-t');
      bind(g, function () { return { k: 't', i: i, s: 2 }; });
    });
    Array.prototype.forEach.call(document.querySelectorAll('#sheet .joist[data-i]'), function (g) {
      var i = attr(g, 'data-i'), s = attr(g, 'data-s');
      bind(g, function () { return { k: 'j', i: i, s: s }; });
    });
    Array.prototype.forEach.call(document.querySelectorAll('#sheet .bearer'), function (g) {
      var i = g.hasAttribute('data-side') ? P.nb - 1 : attr(g, 'data-j'), s = attr(g, 'data-s');
      bind(g, function () { return { k: 'b', i: i, s: s }; });
    });
    Array.prototype.forEach.call(document.querySelectorAll('#sheet .post'), function (g) {
      bind(g, function () { return { k: 'p', i: 0, s: 0 }; });
    });
    Array.prototype.forEach.call(document.querySelectorAll('#sheet .dpost'), function (g) {
      var s = attr(g, 'data-s'), i = g.hasAttribute('data-r') ? (P.nb - 1) * S[s].p.npp + attr(g, 'data-r') : attr(g, 'data-q');
      bind(g, function () { return { k: 'd', i: i, s: s }; });
    });
  }

  function render() {
    sel = null;
    drawSheet();
    wire();
    paintSel();
  }

  $('sheet').addEventListener('mouseleave', function () { sel = null; paintSel(); });
  $('t-j').addEventListener('change', render);
  $('t-b').addEventListener('change', render);
  $('t-p').addEventListener('change', render);
  $('t-d').addEventListener('change', render);
  $('t-f').addEventListener('change', render);
  $('t-v').addEventListener('change', render);
  drawText();
  render();
})();
</script>

</body></html>
